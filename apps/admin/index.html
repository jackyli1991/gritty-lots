<!doctype html>
<html lang="en" data-theme-color="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gritty-lots</title>
    <!-- Apply color scheme before first paint to avoid FOUC.
         Mirrors useColorMode logic (key: gritty-color-mode). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gritty-color-mode');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
