pre-commit:
  commands:
    oxfmt:
      run: pnpm format {staged_files}
    oxlint:
      run: pnpm lint {staged_files}
    cspell:
      run: pnpm spellcheck {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1} # 验证 commit message 是否符合 Conventional Commits 规范
